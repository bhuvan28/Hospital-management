services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmh_hctm}
      POSTGRES_USER: ${POSTGRES_USER:-rmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmh_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmh} -d ${POSTGRES_DB:-rmh_hctm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-only-not-for-production}
      # Compose DNS name; host-side processes must use localhost (see .env.example).
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-rmh_hctm}
      POSTGRES_USER: ${POSTGRES_USER:-rmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmh_dev_only}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rmh}:${POSTGRES_PASSWORD:-rmh_dev_only}@postgres:5432/${POSTGRES_DB:-rmh_hctm}
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: RMH HCTM UKM
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
