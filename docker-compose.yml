services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmh_hctm}
      POSTGRES_USER: ${POSTGRES_USER:-rmh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmh} -d ${POSTGRES_DB:-rmh_hctm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Bind only to localhost so PostgreSQL is not published on the public interface.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_HOST: postgres
      # In-network hostname. Host-side .env must use localhost, not this value.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rmh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rmh_hctm}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-RMH HCTM UKM}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  postgres_data:
